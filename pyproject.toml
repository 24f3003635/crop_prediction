[project]
name = "crop-prediction"
version = "0.1.0"
description = '''AI-powered crop recommendation system that predicts the top-5 
                suitable crops from soil (N, P, K, pH) and climate (temperature, humidity, rainfall) data 
                using a Random Forest model, served via a Flask REST API.'''
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "joblib==1.5.3",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
]
